services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deep_research_db
      POSTGRES_USER: deep_research
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run python3 scripts/generate_env.py first}
    volumes:
      - research_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_research -d deep_research_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://deep_research:${DB_PASSWORD:?missing local DB_PASSWORD}@db:5432/deep_research_db
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  research_db:
