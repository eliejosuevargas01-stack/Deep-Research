- finding_id: F2-ERR-01
  feature: 002-pipeline-autonomo-seguro
  lens: "Estados de erro e edge cases"
  summary: "Falha de persistência SQLAlchemy deixa sessão em estado de rollback pendente, impedindo PipelineRunner de registrar status 'falha' e causando falha silenciosa."
  confidence: "alta"
  suspected_severity: "high"
  signals: ["operational-risk?", "intermittency?"]
  evidence:
    - "app/core/pipeline_runner.py:54: async with session_factory() as db: mantém a mesma sessão durante toda a execução"
    - "app/core/pipeline_runner.py:161-172: bloco except Exception as exc: invoca await repo.update_pipeline_status(...) sem chamar await db.rollback() prévio"
    - "sqlalchemy.exc.PendingRollbackError: disparado se a exceção original ocorreu durante operação de banco, impedindo a gravação do status 'falha' e deixando o registro congelado em 'buscando', 'auditando' ou 'redigindo'"

