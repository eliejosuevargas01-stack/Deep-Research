    - "app/core/searcher.py:523-531 -> pontos_falhados = [r for r in resumos if r['falha_coleta']] e logo apos 'status_pesquisa': 'coletado' fixo no dicionario de retorno"
    - "app/core/searcher.py:452-453 -> falha_coleta = len(urls_lidas_dedup) == 0; status_ponto = STATUS_FALHA_COLETA if falha_coleta else 'coletado' (o ponto acusa falha, a pesquisa nao)"
    - "_reversa_forward/004-falhas-de-coleta-e-diagnostico/requirements.md: escopo 2.1 RF-04 -> a resposta da etapa de busca deve expor, por ponto, o detalhe da falha de coleta, e nao apenas contadores zerados; RF-06 (nao coberto aqui) trata do status da pesquisa"
    - "Impacto: o incidente original (pesquisa marcada 'coletado' com zero evidencia) permanece possivel no nivel agregado mesmo com o ponto individual correto. Uma pesquisa com 1 ponto valido e 4 em falha_coleta reporta 'coletado' sem sinalizacao."

