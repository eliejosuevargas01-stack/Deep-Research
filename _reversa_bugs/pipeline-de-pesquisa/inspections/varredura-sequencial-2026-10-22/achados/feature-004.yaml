- finding_id: F4-CONTRACT-01
  lens: Contratos e integracoes
  feature: 004-falhas-de-coleta-e-diagnostico
  summary: "JinaReader.read() engole erro da Jina encapsulado em HTTP 200 (ex.: 402 devolvido como corpo markdown de erro), tratando mensagem de erro como conteudo legitimo."
  confidence: alta
  suspected_severity: high
  signals: [data-corruption, intermittency]
  evidence:
    - "app/tools/jina_client.py:164-169 -> comentarproprio admite 'mesmo defeito de classe do search() - o corpo de erro (ex.: 402 InsufficientBalanceError) era devolvido como markdown legitimo'; res = await self._request(url, headers) e return res.text sem inspecionar conteudo"
    - "app/tools/jina_client.py:153-169 -> nenhuma verificacao de marcador de erro no corpo texto antes de retornar"
    - "_reversa_forward/004-falhas-de-coleta-e-diagnostico/requirements.md -> RF-01 estabelece que o cliente Jina deve classificar e expor falhas sem converte-las em conteudo vazio ou valido"
    - "Nota: o metodo search() agora usa _request com classify_failure; read() reutiliza _request mas devolve res.text direto, e o erro pode vir em 200 conforme o comentario do proprio codigo."

- finding_id: F4-CONTRACT-02
  lens: Contratos e integracoes
  feature: 004-falhas-de-coleta-e-diagnostico
  summary: "Timeouts e erros de transporte httpx (ConnectError/ReadTimeout) em chamadas da Jina nao sa convertidos em JinaError, subindo como excecao generica e mascarando a categoria."
  confidence: alta
  suspected_severity: medium
  signals: [intermittency, operational-risk]
  evidence:
    - "app/tools/jina_client.py:88-99 -> laco de tentativa chama await self._client.get(url, headers=headers) sem try/except para httpx.TransportError ou httpx.TimeoutException"
    - "app/tools/jina_client.py -> apenas caminho de status HTTP >= 400 gera classify_failure; falha de rede nao entra nesse caminho"
    - "_reversa_forward/004-falhas-de-coleta-e-diagnostico/requirements.md -> RF-01 fala em expor falhas de error HTTP da Jina; erros de rede ficaram fora do escopo explicito, mas a camada de diagnostico deveria categoriza-los"
    - "Consequencia operacional: relatorio de falha nao distingue 'Jina fora do ar' de 'URL especifica nao respondeu', dificultando a acao corretiva."

