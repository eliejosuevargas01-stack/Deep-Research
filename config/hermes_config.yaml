# Hermes Deep Research — configuração de execução.
# O Hermes é o núcleo agêntico: cada papel (planner, persona, auditor, redator)
# é uma chamada isolada cujo 1º prompt é hidratado pelo backend a partir do banco.

engine:
  base_url: "http://9router:20128/v1"
  api_key_env: "LLM_API_KEY"
  model: "deepseek/deepseek-v3.2"
  temperature: 0.2
  timeout_s: 600

pipeline:
  max_pontos_paralelos: 3
  max_queries_por_persona: 3
  tentativas_por_agente: 2
  webhook_timeout_s: 15
  db_path: "data/deep_research.db"
