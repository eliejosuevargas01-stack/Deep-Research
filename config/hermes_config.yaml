# Hermes Deep Research — configuração de execução.
# Não há provedor de LLM aqui: o Hermes (perfil `deep-research`) executa cada papel.
# Modelo por papel vive em hermes_home/profiles/deep-research/config.yaml.

pipeline:
  max_queries_por_persona: 3
  tentativas_por_agente: 2
  webhook_timeout_s: 15
  db_path: "data/deep_research.db"
  workspaces_dir: "data/workspaces"
  hermes_bin: "hermes"
  hermes_profile: "deep-research"
  hermes_timeout_s: 3600

