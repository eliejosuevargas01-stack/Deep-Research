<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research Engine</title>
    <meta name="reversa-category" content="architecture">
    <meta name="reversa-producer-agent" content="reversa-docs-publisher">
    <meta name="reversa-generated-at" content="2026-10-01T02:00:00Z">
    <script src="assets/vendor/three.min.js"></script>
    <script src="assets/vendor/OrbitControls.js"></script>
    <script src="assets/js/data.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #0a0a10; color: #eaeaea; }
        #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 9999; }
        #sidebar { position: fixed; top: 0; right: 0; width: 300px; height: 100vh; padding: 16px; background: rgba(15, 15, 20, 0.85); overflow-y: auto; }
        #sidebar h3 { margin-top: 0; }
        #sidebar button { display: block; width: 100%; margin: 4px 0; padding: 8px; }
    </style>
</head>
<body>
    <div id="loader">Carregando cena 3D...</div>
    <canvas id="scene"></canvas>
    <aside id="sidebar">
        <h3>Deep Research Engine</h3>
        <p>Arquitetura 3D do pipeline multiagente de pesquisa profunda.</p>
        <button id="reset">Resetar Câmera</button>
        <button id="export-png">Exportar PNG</button>
    </aside>
    <script>
        // Dados já carregados via window.RV_DATA
        var modules = RV_DATA.modules.map(m => ({ name: m.name, folder: m.folder, loc: m.loc }));
        var deps = RV_DATA.deps;

        // Cena Three.js - Code City
        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a10);
        var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        var renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('scene').appendChild(renderer.domElement);
        renderer.setAnimationLoop(function() { renderer.render(scene, camera); });

        var controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        camera.position.set(50, 60, 80);
        controls.update();

        var hemi = new THREE.HemisphereLight(0xffffff, 0x0a0a10, 0.6);
        scene.add(hemi);
        var dir = new THREE.DirectionalLight(0xffffff, 0.7);
        dir.position.set(50, 100, 50);
        dir.castShadow = true;
        scene.add(dir);

        // Agrupar módulos por pasta
        var groupMap = {};
        modules.forEach(function(m) {
            if (!groupMap[m.folder]) groupMap[m.folder] = [];
            groupMap[m.folder].push(m);
        });

        var groupHeight = {};
        Object.keys(groupMap).forEach(function(f, i) {
            var mods = groupMap[f];
            var group = new THREE.Group();
            group.position.x = i * 25;
            groupHeight[f] = 0;
            mods.forEach(function(m, j) {
                var h = Math.max(2, Math.min(30, m.loc / 20));
                var geo = new THREE.BoxGeometry(8, h, 8);
                var color = ({ code: 0x4f46e5, security: 0xef4444, agent: 0x10b981, worker: 0x3b82f6, tool: 0xf59e0b, auditor: 0x8b5cf6, writer: 0xec4899, db: 0x6366f1, service: 0x14b8a8, default: 0x6b7280 })[m.type] || 0x6b7280;
                var mat = new THREE.MeshStandardMaterial({ color: color });
                var mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = h / 2;
                mesh.userData = { name: m.name };
                group.add(mesh);
                if (j > 0) groupHeight[f] = groupHeight[f] + 10;
            });
            scene.add(group);
        });

        document.getElementById('reset').onclick = function() { camera.position.set(50, 60, 80); controls.target.set(0, 0, 0); controls.update(); };
        document.getElementById('export-png').onclick = function() { var link = document.createElement('a'); link.href = renderer.domElement.toDataURL(); link.download = 'arquitetura-3d.png'; link.click(); };

        window.addEventListener('resize', function() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        document.getElementById('loader').style.display = 'none';
    </script>
</body>
</html>
